spring.application.name=EmployeeManagementSystem

# ---------------------------------------------------------------------------
# Exercise 1: primary H2 database connection.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true

# ---------------------------------------------------------------------------
# Exercise 9: secondary "reporting" data source. Exposed as a plain
# DataSource/JdbcTemplate (not a second JPA EntityManagerFactory) to keep the
# example focused - see config/DataSourceConfig.java and README.md.
# ---------------------------------------------------------------------------
reporting.datasource.url=jdbc:h2:mem:reportingdb
reporting.datasource.driverClassName=org.h2.Driver
reporting.datasource.username=sa
reporting.datasource.password=password

# ---------------------------------------------------------------------------
# Exercise 10: Hibernate-specific batch processing tuning.
# ---------------------------------------------------------------------------
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
